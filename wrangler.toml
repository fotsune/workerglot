name = "polyglot"
main = "worker.ts"
compatibility_date = "2026-11-18"

# Secrets are set with `wrangler secret put NAME`, never committed here.
# Available names: ACCESS_TOKEN, DEEPL_API_KEY, AZURE_TRANSLATOR_KEY,
# AZURE_TRANSLATOR_REGION, AZURE_TRANSLATOR_ENDPOINT, AWS_ACCESS_KEY_ID,
# AWS_SECRET_ACCESS_KEY, AWS_REGION, DEEPLX_CLOUDFLARE_URL, DEEPLX_VERCEL_URL,
# LIBRETRANSLATE_URL, LIBRETRANSLATE_API_KEY.

[vars]
REQUEST_TIMEOUT_MS = "15000"
MAX_TEXT_LENGTH = "5000"

# Set to "true" to use configured paid providers before the free ones.
PREFER_PAID = "true"

# Add a route or workers.dev hostname in the Cloudflare dashboard, or uncomment:
# routes = [{ pattern = "translate.example.com", custom_domain = true }]

[observability]
enabled = true
head_sampling_rate = 1
